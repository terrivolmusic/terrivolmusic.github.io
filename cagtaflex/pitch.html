<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cagta Flex | New Release</title>
<style>
  :root { --bg: #07070c; --cyan: #00e5d4; --mag: #ff2ea6; --txt: #f3f3f8; }
  body { background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; text-align: center; padding: 20px; margin: 0; }
  .container { max-width: 600px; margin: 0 auto; }
  img.hero { width: 100%; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  h1 { font-size: 24px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
  p { color: #9a9aac; font-size: 14px; line-height: 1.6; }
  .btn { display: inline-block; background: var(--cyan); color: #04110f; padding: 12px 24px; border-radius: 50px; text-decoration: none; font-weight: 700; margin: 20px 0; transition: .3s; }
  .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--cyan); }
  .spotify-embed { margin-top: 30px; border-radius: 12px; overflow: hidden; }
  .footer { margin-top: 40px; font-size: 11px; color: #6a6a7c; border-top: 1px solid #23232f; padding-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <!-- IMAGEN PRINCIPAL (La que usarás también en el correo) -->
  <img src="/img/youtube.jpg" alt="Cagta Flex Live" class="hero">
  
  <h1>Cagta Flex</h1>
  <p>Rap Urbano · Live Beatmaking · Bogotá 🇨🇴</p>
  
  <!-- BOTÓN DE ACCIÓN -->
  <a href="https://terrivolmusic.github.io/cagtaflex/epk.html" class="btn">VER EPK COMPLETO</a>

  <!-- PLAYER DE SPOTIFY (El más importante para el curador) -->
  <div class="spotify-embed">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/7evZAbVsgc6PyYJXI9HT4V?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <div class="footer">
    Management: Selena Ramírez | Terrivol Music SAS<br>
    Sony Music Publishing / BMI
  </div>
</div>
</body>
</html>
