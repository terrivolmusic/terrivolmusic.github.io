<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrivol Lead Center // Music Industry Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .genre-chip.active { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; border-color: transparent; }
        .score-bar { transition: width 0.5s ease; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .mensaje-box { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
        .copy-flash { animation: flash 0.5s ease; }

<body class="bg-gray-950 text-gray-200 min-h-screen">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-gray-900 via-purple-950 to-gray-900 border-b border-gray-800 px-6 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-crosshairs text-pink-400"></i>
                    Terrivol Lead Center
                </h1>
                <p class="text-xs text-gray-400 mt-1">Motor de Inteligencia para Captación de Artistas y Productores</p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="exportarCSV()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded-lg text-xs transition flex items-center gap-2">
                    <i class="fa-solid fa-file-csv"></i> CSV
                </button>
                <button onclick="copiarTodosMensajes()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-xs transition flex items-center gap-2">
                    <i class="fa-solid fa-copy"></i> Copiar Todos
                </button>
                <button onclick="guardarConfig()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-xs transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- PANEL IZQUIERDO: CONFIGURACIÓN -->
        <div class="lg:col-span-1 space-y-6">

            <!-- 1. GÉNEROS -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <h2 class="text-sm font-semibold text-gray-400 uppercase mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-music text-purple-400"></i> 1. Géneros
                </h2>
                <div id="generos-container" class="flex flex-wrap gap-2"></div>
                <button onclick="seleccionarTodos()" class="mt-3 text-xs text-purple-400 hover:text-purple-300">Seleccionar todos</button>
            </div>

            <!-- 2. CRITERIOS -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5 space-y-4">
                <h2 class="text-sm font-semibold text-gray-400 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-filter text-pink-400"></i> 2. Criterios
                </h2>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Seguidores mínimos</label>
                    <input type="number" id="min-seguidores" value="500" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Seguidores máximos</label>
                    <input type="number" id="max-seguidores" value="50000" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Score mínimo (1-100)</label>
                    <input type="number" id="min-score" value="60" max="100" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Región</label>
                    <select id="region" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                        <option value="mix">🎲 Mix balanceado (recomendado)</option>
                        <option value="latam">🌎 Latinoamérica</option>
                        <option value="usa">🇺🇸 USA / Canadá</option>
                        <option value="europa">🇪🇺 Europa</option>
                        <option value="global">🌍 Global</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Cantidad de leads</label>
                    <input type="number" id="cantidad" value="15" min="5" max="100" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <!-- 3. TIPO DE PERFIL -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <h2 class="text-sm font-semibold text-gray-400 uppercase mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-group text-green-400"></i> 3. Tipo de Perfil
                </h2>
                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="tipo-productor" checked class="accent-purple-500"> Productores / Beatmakers
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="tipo-artista" checked class="accent-purple-500"> Artistas / Cantantes
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="tipo-dj" checked class="accent-purple-500"> DJs / Remixers
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="tipo-ingeniero" class="accent-purple-500"> Ingenieros de Mezcla
                    </label>
                </div>
            </div>

            <!-- 4. ÁNGULO DEL MENSAJE -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <h2 class="text-sm font-semibold text-gray-400 uppercase mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-comment-dots text-blue-400"></i> 4. Ángulo del Mensaje
                </h2>
                <select id="angulo-mensaje" class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                    <option value="mixto">🎲 Mixto (variar automáticamente)</option>
                    <option value="colaboracion">🤝 Colaboración Musical</option>
                    <option value="negocio">💼 Propuesta de Negocio</option>
                    <option value="produccion">🎵 Producción / Beats</option>
                    <option value="networking">🌐 Networking General</option>
                </select>
            </div>

                <i class="fa-solid fa-rocket"></i>
                EJECUTAR BÚSQUEDA INTELIGENTE
            </button>

        </div>

        <!-- PANEL DERECHO: RESULTADOS -->
        <div class="lg:col-span-2 space-y-6">

            <!-- ESTRATEGIA -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <h2 class="text-sm font-semibold text-gray-400 uppercase mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-brain text-yellow-400"></i> Estrategia Generada
                </h2>
                <div id="estrategia" class="text-sm text-gray-300">
                    <p class="text-gray-500 italic">Configura y ejecuta para ver la estrategia.</p>
                </div>
            </div>

            <!-- LEADS -->
            <div class="bg-gray-900 rounded-xl border border-gray-800 p-5">
                <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                    <h2 class="text-sm font-semibold text-gray-400 uppercase flex items-center gap-2">

                    </h2>

                    </button>
                </div>

                    <div class="text-center py-12 text-gray-500">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-3"></i>
                        <p>Esperando búsqueda...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

            ru: {
                colaboracion: "Привет {nombre}! 👋\n\nЯ видел твой профиль и мне очень понравилась твоя работа как {tipoPerfil} в жанре {genero}. Я работаю над несколькими музыкальными проектами и думаю, что твой стиль идеально подойдёт к тому, что мы задумали.\n\nТебе было бы интересно изучить возможность сотрудничества? Мне бы очень хотелось услышать твой звук.\n\n🎵 Всего хорошего!",
                negocio: "Привет {nombre}! 👋\n\nЯ видел твой профиль и впечатлён твоей работой в жанре {genero}. У меня есть бизнес-предложение, связанное с музыкальным продакшеном и дистрибуцией, которое может тебя заинтересовать.\n\nУ тебя есть время поговорить на этой неделе? 💼\n\nВсего хорошего!",
                produccion: "Привет {nombre}! 👋\n\nЯ продюсер и видел твой профиль. Мне очень нравится твой звук в жанре {genero}, у него очень сильная идентичность.\n\nЯ ищу сотрудников для нескольких продакшен-проектов, которые у меня в голове. Хотел бы услышать несколько идей и посмотреть, подходим ли мы друг другу? 🎹\n\nВсего хорошего!",
                networking: "Привет {nombre}! 👋\n\nЯ видел, что ты тоже в сцене {genero}. Я хотел бы связаться с другими профессионалами индустрии, чтобы делиться опытом, возможностями и расти вместе.\n\nХотел бы оставаться на связи? 🌐\n\nВсего хорошего!"
            }
        };

        // ============================================
        // 🌍 DATOS GEO
        // ============================================
        const GEO = {
            latam: {
                nombres: ["Carlos M.","Luis R.","Diego S.","Juan C.","María L.","Sofía G.","Andrés P.","Valentina R."],
                paises: ["México","Colombia","Argentina","Chile","España"],
                idiomas: {"México":"es","Colombia":"es","Argentina":"es","Chile":"es","España":"es"}
            },
            usa: {
                nombres: ["James W.","Aisha J.","Marcus T.","Sarah L.","Devon K.","Maya B.","Tyler J."],
                paises: ["USA","Canadá"],
                idiomas: {"USA":"en","Canadá":"en"}
            },
            europa: {
                nombres: ["Hans K.","Pierre L.","Olga M.","Marco P.","Emma S.","Lukas B.","Isabella F."],
                paises: ["Francia","Alemania","Italia","UK","Holanda","España"],
                idiomas: {"Francia":"fr","Alemania":"de","Italia":"it","UK":"en","Holanda":"en","España":"es"}
            },
            mix: {
                nombres: ["Carlos M.","James W.","Hans K.","Yuki T.","Luis R.","Aisha J.","Pierre L.","Kim H.","Marco P.","Olga M.","Diego S.","Sarah L."],
                paises: ["México","USA","España","Japón","Colombia","Francia","Argentina","UK","Alemania","Italia","Brasil","Corea"],
                idiomas: {"México":"es","USA":"en","España":"es","Japón":"ja","Colombia":"es","Francia":"fr","Argentina":"es","UK":"en","Alemania":"de","Italia":"it","Brasil":"pt","Corea":"ko"}
            }
        };

        // ============================================
        // 🎯 ESTADO
        // ============================================
        let generosSeleccionados = new Set();
        let leadsEncontrados = [];

        // ============================================
        // 🚀 INICIALIZACIÓN
        // ============================================
        function init() {
            const container = document.getElementById('generos-container');
            Object.keys(HASHTAGS_POR_GENERO).forEach(genero => {
                const chip = document.createElement('button');
                chip.className = 'genre-chip px-3 py-1 rounded-full text-xs border border-gray-700 bg-gray-800 hover:bg-gray-700 transition';
                chip.textContent = genero.charAt(0).toUpperCase() + genero.slice(1);
                chip.dataset.genero = genero;
                chip.onclick = () => toggleGenero(genero, chip);
                container.appendChild(chip);
            });
            cargarConfig();
        }

        function toggleGenero(genero, chip) {
            if (generosSeleccionados.has(genero)) {
                generosSeleccionados.delete(genero);
                chip.classList.remove('active');
            } else {
                generosSeleccionados.add(genero);
                chip.classList.add('active');
            }
        }

        function seleccionarTodos() {
            const chips = document.querySelectorAll('.genre-chip');
            const todosSeleccionados = generosSeleccionados.size === chips.length;
            chips.forEach(chip => {
                if (todosSeleccionados) {
                    generosSeleccionados.delete(chip.dataset.genero);
                    chip.classList.remove('active');
                } else {
                    generosSeleccionados.add(chip.dataset.genero);
                    chip.classList.add('active');
                }
            });
        }

        // ============================================
        // 🔍 MOTOR DE BÚSQUEDA
        // ============================================
        function ejecutarBusqueda() {
            if (generosSeleccionados.size === 0) {
                alert('⚠️ Selecciona al menos un género musical');
                return;
            }

            const cantidad = parseInt(document.getElementById('cantidad').value);
            const region = document.getElementById('region').value;
            const minSeg = parseInt(document.getElementById('min-seguidores').value);
            const maxSeg = parseInt(document.getElementById('max-seguidores').value);
            const minScore = parseInt(document.getElementById('min-score').value);

            generarEstrategia();

            leadsEncontrados = [];
            const generosArray = Array.from(generosSeleccionados);
            const geo = GEO[region] || GEO.mix;
            let intentos = 0;

            while (leadsEncontrados.length < cantidad && intentos < cantidad * 3) {
                intentos++;
                const genero = generosArray[Math.floor(Math.random() * generosArray.length)];
                const datosGenero = HASHTAGS_POR_GENERO[genero];
                const pais = geo.paises[Math.floor(Math.random() * geo.paises.length)];
                const nombre = geo.nombres[Math.floor(Math.random() * geo.nombres.length)];
                const idioma = geo.idiomas[pais] || 'en';

                const lead = {
                    id: Date.now() + Math.random(),
                    username: generarUsername(genero),
                    nombre: nombre,
                    pais: pais,
                    idioma: idioma,
                    genero: genero,
                    seguidores: Math.floor(Math.random() * (maxSeg - minSeg)) + minSeg,
                    score: calcularScore(datosGenero.peso),
                    hashtags: datosGenero.tags.slice(0, 3),
                    tipoPerfil: obtenerTipoPerfil(),
                    angulo: obtenerAngulo()
                };

                lead.mensaje = generarMensaje(lead);

                if (lead.score >= minScore) {
                    leadsEncontrados.push(lead);
                }
            }

            leadsEncontrados.sort((a, b) => b.score - a.score);
            renderLeads();
        }

        function generarUsername(genero) {
            const prefijos = ["the","real","official","young","big","lil","dj","prod","king","lord"];
            const sufijos = ["beats","music","sounds","prod","studio","vibes","official","wav","records"];
            const pref = prefijos[Math.floor(Math.random() * prefijos.length)];
            const suf = sufijos[Math.floor(Math.random() * sufijos.length)];
            const num = Math.random() > 0.5 ? Math.floor(Math.random() * 999) : '';
            return `${pref}${genero.slice(0,5)}${suf}${num}`.toLowerCase().replace(/\s/g,'');
        }

        function calcularScore(pesoGenero) {
            const variacion = Math.floor(Math.random() * 20) - 10;
            const bonus = Math.random() > 0.7 ? 10 : 0;
            return Math.min(100, Math.max(40, pesoGenero + variacion + bonus));
        }

        function obtenerTipoPerfil() {
            const tipos = [];
            if (document.getElementById('tipo-productor').checked) tipos.push('Productor');
            if (document.getElementById('tipo-artista').checked) tipos.push('Artista');
            if (document.getElementById('tipo-dj').checked) tipos.push('DJ');
            if (document.getElementById('tipo-ingeniero').checked) tipos.push('Ingeniero');
            return tipos.length ? tipos[Math.floor(Math.random() * tipos.length)] : 'Productor';
        }

        function obtenerAngulo() {
            const angulo = document.getElementById('angulo-mensaje').value;
            if (angulo === 'mixto') {
                const opciones = ['colaboracion','negocio','produccion','networking'];
                return opciones[Math.floor(Math.random() * opciones.length)];
            }
            return angulo;
        }

        function generarMensaje(lead) {
            const plantilla = MENSAJES[lead.idioma]?.[lead.angulo] || MENSAJES.en.colaboracion;
            return plantilla
                .replace(/{nombre}/g, lead.nombre.split(' ')[0])
                .replace(/{tipoPerfil}/g, lead.tipoPerfil.toLowerCase())
                .replace(/{genero}/g, lead.genero.charAt(0).toUpperCase() + lead.genero.slice(1));
        }

        function regenerarMensaje(leadId) {
            const lead = leadsEncontrados.find(l => l.id === leadId);
            if (!lead) return;
            const angulos = ['colaboracion','negocio','produccion','networking'];
            lead.angulo = angulos[Math.floor(Math.random() * angulos.length)];
            lead.mensaje = generarMensaje(lead);
            renderLeads();
        }

        // ============================================
        // 📊 RENDERIZADO
        // ============================================
        function generarEstrategia() {
            const generosArray = Array.from(generosSeleccionados);
            const region = document.getElementById('region').value;
            const angulo = document.getElementById('angulo-mensaje').value;

            let html = '<div class="space-y-3 fade-in">';
            html += `<p class="text-gray-400">🎯 <strong class="text-white">${generosArray.length} géneros</strong> | Región: <strong class="text-white">${region.toUpperCase()}</strong> | Ángulo: <strong class="text-white">${angulo.toUpperCase()}</strong></p>`;
            
            html += '<div class="bg-gray-800 rounded-lg p-3">';
            html += '<p class="text-xs text-gray-400 mb-2">HASHTAGS ESTRATÉGICOS:</p>';
            html += '<div class="flex flex-wrap gap-1">';
            generosArray.forEach(g => {
                HASHTAGS_POR_GENERO[g].tags.slice(0, 2).forEach(tag => {
                    html += `<span class="bg-purple-900/40 text-purple-300 text-xs px-2 py-1 rounded">${tag}</span>`;
                });
            });
            html += '</div></div>';
            
            html += '<div class="bg-gray-800 rounded-lg p-3">';
            html += '<p class="text-xs text-gray-400 mb-2">KEYWORDS:</p>';
            html += '<div class="flex flex-wrap gap-1">';
            generosArray.forEach(g => {
                HASHTAGS_POR_GENERO[g].keywords.forEach(kw => {
                    html += `<span class="bg-pink-900/40 text-pink-300 text-xs px-2 py-1 rounded">"${kw}"</span>`;
                });
            });
            html += '</div></div></div>';
            
            document.getElementById('estrategia').innerHTML = html;
        }

        function renderLeads() {
            const container = document.getElementById('leads-container');
            document.getElementById('contador-leads').textContent = leadsEncontrados.length;
            
            if (leadsEncontrados.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500">No se encontraron leads. Ajusta los filtros.</div>';
                return;
            }

            const anguloLabels = {
                colaboracion: { icon: 'fa-handshake', color: 'text-blue-400', label: 'Colaboración' },
                negocio: { icon: 'fa-briefcase', color: 'text-yellow-400', label: 'Negocio' },
                produccion: { icon: 'fa-music', color: 'text-green-400', label: 'Producción' },
                networking: { icon: 'fa-network-wired', color: 'text-purple-400', label: 'Networking' }
            };

            const idiomaLabels = {
                es: '🇪🇸 ES', en: '🇺🇸 EN', pt: '🇧🇷 PT', fr: '🇫🇷 FR',
                de: '🇩🇪 DE', it: '🇮🇹 IT', ja: '🇯🇵 JA', ko: '🇰🇷 KO', ru: '🇷🇺 RU'
            };

            container.innerHTML = leadsEncontrados.map(lead => {
                const scoreColor = lead.score >= 80 ? 'text-green-400 bg-green-900/30' : 
                                   lead.score >= 60 ? 'text-yellow-400 bg-yellow-900/30' : 
                                   'text-red-400 bg-red-900/30';
                const scoreBarColor = lead.score >= 80 ? 'bg-green-500' : 
                                      lead.score >= 60 ? 'bg-yellow-500' : 'bg-red-500';
                const ang = anguloLabels[lead.angulo];
                
                return `
                    <div class="bg-gray-800 rounded-lg border border-gray-700 fade-in hover:border-purple-500 transition">
                        <!-- HEADER DEL LEAD -->
                        <div class="p-4 flex items-start justify-between gap-4 border-b border-gray-700">
                            <div class="flex items-start gap-3 flex-1">
                                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white font-bold flex-shrink-0">
                                    ${lead.nombre.charAt(0)}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <h3 class="font-semibold text-white">@${lead.username}</h3>
                                        <span class="text-xs px-2 py-0.5 rounded-full bg-purple-900/40 text-purple-300">${lead.genero}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-300">${lead.tipoPerfil}</span>
                                    </div>
                                    <p class="text-xs text-gray-400 mt-1">${lead.nombre} • ${lead.pais} • ${lead.seguidores.toLocaleString()} seguidores</p>
                                </div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="text-xs text-gray-400 mb-1">SCORE</div>
                                <div class="text-2xl font-bold ${scoreColor} px-3 py-1 rounded">${lead.score}</div>
                                <div class="w-20 h-1 bg-gray-700 rounded-full mt-2 overflow-hidden">
                                    <div class="score-bar h-full ${scoreBarColor}" style="width: ${lead.score}%"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- MENSAJE GENERADO -->
                        <div class="p-4">
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <span class="text-xs ${ang.color} flex items-center gap-1">
                                        <i class="fa-solid ${ang.icon}"></i> ${ang.label}
                                    </span>
                                    <span class="text-xs text-gray-500">${idiomaLabels[lead.idioma] || lead.idioma.toUpperCase()}</span>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="regenerarMensaje(${lead.id})" class="text-xs bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded transition" title="Regenerar mensaje">
                                        <i class="fa-solid fa-rotate"></i>
                                    </button>
                                    <button onclick="copiarMensaje(${lead.id}, this)" class="text-xs bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded transition" title="Copiar mensaje">
                                        <i class="fa-solid fa-copy"></i> Copiar
                                    </button>
                                </div>
                            </div>
                            <div id="msg-${lead.id}" class="mensaje-box bg-gray-900 border border-gray-700 rounded-lg p-3 text-gray-200">${lead.mensaje}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ============================================
        // 🛠️ UTILIDADES
        // ============================================
        function copiarMensaje(leadId, btn) {
            const lead = leadsEncontrados.find(l => l.id === leadId);
            if (!lead) return;
            navigator.clipboard.writeText(lead.mensaje);
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!';
            btn.classList.remove('bg-green-600');
            btn.classList.add('bg-blue-600');
            setTimeout(() => {
                btn.innerHTML = original;
                btn.classList.add('bg-green-600');
                btn.classList.remove('bg-blue-600');
            }, 1500);
        }

        function copiarTodosMensajes() {
            if (leadsEncontrados.length === 0) {
                alert('No hay leads para copiar');
                return;
            }
            const todos = leadsEncontrados.map((l, i) => 
                `=== LEAD ${i+1}: @${l.username} (${l.pais}) ===\n${l.mensaje}`
            ).join('\n\n');
            navigator.clipboard.writeText(todos);
            alert(`✅ ${leadsEncontrados.length} mensajes copiados al portapapeles`);
        }

        function copiarUsernames() {
            if (leadsEncontrados.length === 0) {
                alert('No hay leads para copiar');
                return;
            }
            const usernames = leadsEncontrados.map(l => '@' + l.username).join('\n');
            navigator.clipboard.writeText(usernames);
            alert(`✅ ${leadsEncontrados.length} usernames copiados`);
        }

        function exportarCSV() {
            if (leadsEncontrados.length === 0) {
                alert('No hay leads para exportar');
                return;
            }
            let csv = 'Username,Nombre,Pais,Idioma,Genero,Seguidores,Score,TipoPerfil,Angulo,Mensaje\n';
            leadsEncontrados.forEach(l => {
                const msg = l.mensaje.replace(/"/g, '""').replace(/\n/g, ' ');
                csv += `"${l.username}","${l.nombre}","${l.pais}","${l.idioma}","${l.genero}",${l.seguidores},${l.score},"${l.tipoPerfil}","${l.angulo}","${msg}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `terrivol-leads-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        function guardarConfig() {
            const config = {
                generos: Array.from(generosSeleccionados),
                minSeg: document.getElementById('min-seguidores').value,
                maxSeg: document.getElementById('max-seguidores').value,
                minScore: document.getElementById('min-score').value,
                region: document.getElementById('region').value,
                cantidad: document.getElementById('cantidad').value,
                angulo: document.getElementById('angulo-mensaje').value,
                tipoProductor: document.getElementById('tipo-productor').checked,
                tipoArtista: document.getElementById('tipo-artista').checked,
                tipoDj: document.getElementById('tipo-dj').checked,
                tipoIngeniero: document.getElementById('tipo-ingeniero').checked
            };
            localStorage.setItem('terrivol-lead-config', JSON.stringify(config));
            alert('✅ Configuración guardada en este navegador');
        }

        function cargarConfig() {
            const saved = localStorage.getItem('terrivol-lead-config');
            if (!saved) return;
            const config = JSON.parse(saved);
            if (config.generos) config.generos.forEach(g => {
                generosSeleccionados.add(g);
                const chip = document.querySelector(`[data-genero="${g}"]`);
                if (chip) chip.classList.add('active');
            });
            if (config.minSeg) document.getElementById('min-seguidores').value = config.minSeg;
            if (config.maxSeg) document.getElementById('max-seguidores').value = config.maxSeg;
            if (config.minScore) document.getElementById('min-score').value = config.minScore;
            if (config.region) document.getElementById('region').value = config.region;
            if (config.cantidad) document.getElementById('cantidad').value = config.cantidad;
            if (config.angulo) document.getElementById('angulo-mensaje').value = config.angulo;
            if (config.tipoProductor !== undefined) document.getElementById('tipo-productor').checked = config.tipoProductor;
            if (config.tipoArtista !== undefined) document.getElementById('tipo-artista').checked = config.tipoArtista;
            if (config.tipoDj !== undefined) document.getElementById('tipo-dj').checked = config.tipoDj;
            if (config.tipoIngeniero !== undefined) document.getElementById('tipo-ingeniero').checked = config.tipoIngeniero;
        }

        // Iniciar
        init();
    </script>
</body>
</html>
