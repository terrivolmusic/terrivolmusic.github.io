<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beats BFYT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #8a2be2 0%, #00f2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 60px;
            font-weight: 300;
        }

        .nav-grid {
            display: grid;
            gap: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(138, 43, 226, 0.3);
            transform: translateY(-2px);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            opacity: 0.8;
        }

        .nav-text {
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .nav-arrow {
            opacity: 0.4;
            font-size: 1.2rem;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(138, 43, 226, 0.2);
            border-radius: 20px;
            font-size: 0.7rem;
            color: #00f2ff;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            margin-top: 60px;
            color: #444;
            font-size: 0.8rem;
        }

        @media (max-width: 640px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .nav-item {
                padding: 20px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">BEATS BFYT</h1>
        <p class="tagline">Premium Cinematic Trap Production</p>

        <div class="nav-grid">
            <a href="https://beats-bfyt-shop.fourthwall.com" target="_blank" class="nav-item">
                <div class="nav-left">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <span class="nav-text">Tienda <span class="badge">Nuevo</span></span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a href="generator.html" class="nav-item">
                <div class="nav-left">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="nav-text">Command Center</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a href="https://youtube.com/@beatsfreeyoutube_" target="_blank" class="nav-item">
                <div class="nav-left">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="nav-text">YouTube Channel</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>

            <a href="https://instagram.com/beatsfreeyoutube_" target="_blank" class="nav-item">
                <div class="nav-left">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <span class="nav-text">Instagram</span>
                </div>
                <span class="nav-arrow">→</span>
            </a>
        </div>

        <div class="footer">
            <p>© 2026 Beats BFYT</p>
            <p style="margin-top: 8px; opacity: 0.6;">Part of Terrivol Music ENT</p>
        </div>
    </div>
</body>
</html>
