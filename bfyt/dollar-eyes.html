<script>
    /* ===== STARFIELD (sin cambios) ===== */
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            radius: Math.random() * 1.5, speed: Math.random() * 0.5 + 0.1, opacity: Math.random()
        });
    }
    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
            ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`; ctx.fill();
            star.y += star.speed;
            if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; }
            star.opacity = Math.random() * 0.5 + 0.5;
        });
        requestAnimationFrame(animateStars);
    }
    animateStars();
    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

    /* ===== REPRODUCTOR CON PROTECCIÓN ANTI-ROBO (MÁX 1:10) ===== */
    const MAX_PREVIEW = 70; // 70 segundos = 1 min 10 seg

    const audio = document.getElementById('audioPlayer');
    const playIcon = document.getElementById('playIcon');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const visualizer = document.getElementById('visualizer');
    const volumeLevel = document.getElementById('volumeLevel');

    const PLAY_PATH = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_PATH = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    // Aviso anti-robo (se crea solo, sin tocar el HTML)
    const notice = document.createElement('p');
    notice.style.cssText = 'color:#00f2ff;font-size:0.85rem;margin-top:12px;text-align:center;display:none;position:relative;z-index:1;';
    notice.innerHTML = '🔒 Preview limit reached (1:10) — <a href="#" id="noticeBuy" style="color:#8a2be2;font-weight:700;text-decoration:underline;">Purchase the full version</a>';
    document.querySelector('.audio-player').appendChild(notice);

    // El aviso lleva al comprador directo a las licencias
    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'noticeBuy') {
            e.preventDefault();
            document.querySelector('.licenses-section').scrollIntoView({ behavior: 'smooth' });
        }
    });

    function togglePlay() {
        if (audio.paused) {
            if (audio.currentTime >= MAX_PREVIEW) audio.currentTime = 0; // replay desde 0
            notice.style.display = 'none';
            audio.play();
            playIcon.innerHTML = PAUSE_PATH;
            visualizer.classList.remove('paused'); visualizer.classList.add('playing');
        } else {
            audio.pause();
            playIcon.innerHTML = PLAY_PATH;
            visualizer.classList.remove('playing'); visualizer.classList.add('paused');
        }
    }

    audio.addEventListener('timeupdate', () => {
        // CORTE DURO en 1:10
        if (audio.currentTime >= MAX_PREVIEW) {
            audio.pause();
            playIcon.innerHTML = PLAY_PATH;
            visualizer.classList.remove('playing'); visualizer.classList.add('paused');
            progressBar.style.width = '100%';
            currentTimeEl.textContent = formatTime(MAX_PREVIEW);
            notice.style.display = 'block';
            return;
        }
        const limit = Math.min(audio.duration || MAX_PREVIEW, MAX_PREVIEW);
        progressBar.style.width = (audio.currentTime / limit) * 100 + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
        // El tiempo mostrado nunca pasa de 1:10
        durationEl.textContent = formatTime(Math.min(audio.duration, MAX_PREVIEW));
    });

    function seek(event) {
        const bar = event.currentTarget;
        const limit = Math.min(audio.duration || MAX_PREVIEW, MAX_PREVIEW);
        let t = (event.offsetX / bar.offsetWidth) * limit;
        if (t > MAX_PREVIEW - 1) t = MAX_PREVIEW - 1; // nunca pasar del límite
        audio.currentTime = t;
        notice.style.display = 'none';
    }

    function setVolume(event) {
        const slider = event.currentTarget;
        const clickPosition = event.offsetX / slider.offsetWidth;
        audio.volume = clickPosition;
        volumeLevel.style.width = (clickPosition * 100) + '%';
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    audio.volume = 0.7;
</script>
