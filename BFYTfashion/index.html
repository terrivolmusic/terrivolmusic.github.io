const CUSTOM_HERO_TAN   = '../img/underground-velocity/tan/tan-modelo-01-model-arriving-at-night-event-2k.jpg';
// ==========================================

const CONFIG = {

  drop:     'DROP 003',
  product:  'Underground Velocity',
  sku:      'BFYT-FSH-003',
  price:    129,

const COLORES = {

  tan:   { label: 'TAN GLOSS',   hex: '#c9a274' }

// Nota: Mantén tus arrays de assets normales aquí abajo tal cual estaban
const ASSETS_FIJO = {

    'video/video-12-woman-animating-in-mirror-reflec.mp4',

    'video/video-14-woman-checks-collar-in-mirror-20.mp4',

  ],
  black: [

    'black/black-producto-02-1150708feb538d4fb57867435361feda.jpg',
    'black/black-producto-03-c5ef1972ce76265ba967fdbcc02a3ec8.jpg',
    'black/black-producto-04-89a3b9798a5850368d6ea403a597644e.jpg',
    'black/black-producto-05-18e186c95d817d7bc3763274bacf9b7a.jpg',
    'black/black-producto-06-01bc633fa1e02e9c66b0be97cc7c7c1b.jpg',
    'black/black-producto-07-78ec2624a2671bc14cbeb0a55dbd22a6.jpg',
    'black/black-modelo-01-model-adjusting-black-puffer-jac.jpg',
    'black/black-modelo-02-model-filming-mirror-selfie-2k-2.jpg',
    'black/black-modelo-03-model-filming-mirror-selfie-2k-2.jpg',
    'black/black-modelo-04-model-filming-mirror-selfie-2k-2.jpg',
    'black/black-modelo-05-model-wearing-puffer-jacket-2k-2.jpg',
    'black/black-modelo-06-model-wearing-puffer-jacket-2k-2.jpg',
    'black/black-modelo-07-woman-taking-mirror-selfie-2k-20.jpg'
  ],
  tan: [
    'tan/tan-producto-01-b67650e525cc888e52ef75e1ee0a1813.jpg',
    'tan/tan-producto-02-9c66f5afab4ea3c2e29e31b64df16a03.jpg',
    'tan/tan-producto-03-3249de8d341e173fe2a2aa2c43120e22.jpg',
    'tan/tan-producto-04-da50d6eaa3a773da0b8d1e18bdbe3163.jpg',
    'tan/tan-producto-05-97392b8cb32c364302c99b5e955a5acb.jpg',
    'tan/tan-producto-06-59deff3f797728e55b637650ebcdc8f4.jpg',
    'tan/tan-producto-07-4d018e3307d59b1c72086d4953f14551.jpg',
    'tan/tan-modelo-01-model-arriving-at-night-event-2k.jpg',
    'tan/tan-modelo-02-model-arriving-at-night-event-2k.jpg',
    'tan/tan-modelo-03-model-arriving-at-night-event-2k.jpg',
    'tan/tan-estudio-01-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-02-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-03-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-04-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-05-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-06-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-07-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-08-pomelli-photoshoot-image-4k-0914.jpg',
    'tan/tan-estudio-09-pomelli-photoshoot-image-4k-0914.jpg'
  ]
};

(function () {
  const RAW = window.BFYT_ASSETS || ASSETS_FIJO;
  const arr = v => Array.isArray(v) ? v : (v === null || v === undefined || v === '' ? [] : [v]);
  const BASE = '../img/underground-velocity/';
  const url = p => BASE + p;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const money = n => CONFIG.currency === 'USD' ? '$' + Number(n).toFixed(2) : Number(n).toFixed(2) + ' ' + CONFIG.currency;

  const A = { video: RAW ? arr(RAW.video) : [] };
  ['black', 'tan'].forEach(c => { A[c] = RAW ? arr(RAW[c]) : []; });

  const coloresDisponibles = ['black', 'tan'].filter(c => A[c].length > 0);
  const hayMedios = coloresDisponibles.length > 0 || A.video.length > 0;
  if (!hayMedios) document.getElementById('missingBar').style.display = 'block';

  const sinCheckout = CONFIG.payhipBlack.indexOf('REEMPLAZAR') !== -1 || CONFIG.payhipTan.indexOf('REEMPLAZAR') !== -1;
  if (sinCheckout) document.getElementById('pendingBar').style.display = 'block';

  const desc = Math.round((1 - CONFIG.price / CONFIG.compare) * 100);
  document.getElementById('priceLine').innerHTML =
    '<s>' + esc(money(CONFIG.compare)) + '</s> <em>' + esc(money(CONFIG.price)) + '</em>' +
    (desc > 0 && desc < 100 ? '<span class="off">-' + desc + '%</span>' : '');

  if (CONFIG.sizes.length) {
    document.getElementById('sizes').innerHTML =
      CONFIG.sizes.map(s => '<span>' + esc(s) + '</span>').join('') +
      '<small>COLOR Y TALLA SE ELIGEN EN EL CHECKOUT · PICK COLOR & SIZE AT CHECKOUT</small>';
  }

  const frase = CONFIG.brand + ' — WHERE SOUND DRESSES — ' + CONFIG.product.toUpperCase() +
                ' — 2 COLORWAYS — ' + CONFIG.drop + ' — FREE WORLDWIDE SHIPPING — ';
  document.getElementById('mq').textContent = frase + frase;

  const lb = document.getElementById('lb');
  const openLB = src => { if (!src) return; lb.style.display = 'flex'; lb.querySelector('img').src = src; };
  const closeLB = () => { lb.style.display = 'none'; };
  lb.onclick = closeLB;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

  function repartir(id) {
    const todas = A[id].slice();
    
    // --- LÓGICA MODIFICADA PARA FORZAR HERO ---
    let heroCustom = id === 'black' ? CUSTOM_HERO_BLACK.replace(BASE, '') : CUSTOM_HERO_TAN.replace(BASE, '');
    
    // Verificamos si existe en nuestro listado, si no, usamos la primera disponible
    const heroFinal = todas.includes(heroCustom) ? heroCustom : (todas[0] || null);
    
    // Resto de lógica normal
    const prod = todas.filter(p => p.indexOf('-producto-') !== -1);
    const pool = todas.filter(p => p.indexOf('-producto-') !== -1 ? false : true);
    const galeria = (prod.length ? prod : todas).slice(0, 7);
    const usados = new Set([heroFinal]); // Marcamos la hero como usada para no repetirla
    
    function take(pistas) {
      if (pistas) {
        for (let i = 0; i < pistas.length; i++) {
          const j = pool.findIndex(x => !usados.has(x) && x.indexOf(pistas[i]) !== -1);
          if (j !== -1) { usados.add(pool[j]); return pool[j]; }
        }
      }
      const k = pool.findIndex(x => !usados.has(x));
      if (k !== -1) { usados.add(pool[k]); return pool[k]; }
      return null;
    }
    function relleno(n, ya) {
      const out = ya.slice();
      let i = 0;
      while (out.length < n && i < galeria.length) { out.push(galeria[i]); i++; }
      return out.slice(0, n);
    }

    const grid  = relleno(3, [take(), take(), take()].filter(Boolean));
    const ugc   = relleno(4, [take(), take(), take(), take()].filter(Boolean));
    const specs = relleno(2, [take(), take()].filter(Boolean));
    const sound = take() || heroFinal;
    
    return { galeria: galeria, hero: heroFinal, grid: grid, ugc: ugc, specs: specs, sound: sound };
  }

  const main = document.getElementById('main');
  const thumbsBox = document.getElementById('thumbs');
  function pintarGaleria(g) {
    thumbsBox.innerHTML = '';
    if (!g.length) { main.removeAttribute('src'); return; }
    main.src = url(g[0]);
    main.onclick = () => openLB(main.src);
    thumbsBox.innerHTML = g.map((p, i) =>
      '<img loading="lazy" src="' + esc(url(p)) + '" data-src="' + esc(url(p)) + '" class="' + (i === 0 ? 'on' : '') + '" alt="UNDERGROUND VELOCITY puffer — vista ' + (i + 1) + '">'
    ).join('');
    thumbsBox.querySelectorAll('img').forEach(t => {
      t.onclick = () => {
        thumbsBox.querySelectorAll('img').forEach(x => x.classList.remove('on'));
        t.classList.add('on');
        main.src = t.dataset.src;
      };
    });
  }

  const filmFigs = [];
  function pintarFilms(color) {
    const posters = A[color].length ? A[color] : A.video;
    filmFigs.forEach((fig, i) => {
      const im = fig.querySelector('img');
      if (im && posters.length) im.src = url(posters[i % posters.length]);
    });
  }

  function pintarColor(id) {
    const r = repartir(id);
    pintarGaleria(r.galeria);
    pintarFilms(id);

    const h = document.getElementById('campHero');
    if (r.hero) { h.src = url(r.hero); h.style.display = ''; h.onclick = () => openLB(h.src); } else { h.style.display = 'none'; }

    const cg = document.getElementById('campGrid');
    cg.innerHTML = r.grid.map((p, i) => '<img loading="lazy" src="' + esc(url(p)) + '" alt="Campaign ' + (i + 1) + '">').join('');
    cg.querySelectorAll('img').forEach(im => im.onclick = () => openLB(im.src));

    const ug = document.getElementById('ugc');
    ug.innerHTML = r.ugc.map((p, i) => '<figure><img loading="lazy" src="' + esc(url(p)) + '" alt="On body ' + (i + 1) + '"></figure>').join('');
    ug.querySelectorAll('img').forEach(im => im.onclick = () => openLB(im.src));

    const si = document.getElementById('specImgs');
    si.innerHTML = r.specs.map((p, i) => '<img loading="lazy" src="' + esc(url(p)) + '" alt="Detalle ' + (i + 1) + '">').join('');
    si.querySelectorAll('img').forEach(im => im.onclick = () => openLB(im.src));

    const s = document.getElementById('soundImg');
    if (r.sound) { s.src = url(r.sound); s.onclick = () => openLB(s.src); }

    document.getElementById('pSku').textContent = CONFIG.sku + '-' + (id === 'black' ? 'BLK' : 'TAN');
    document.getElementById('stickyPrice').textContent = CONFIG.product.toUpperCase() + ' — ' + money(CONFIG.price);
    document.getElementById('buyBtn').textContent = 'Buy Now — ' + money(CONFIG.price);

    coloresDisponibles.forEach(c => {
      const b = document.getElementById('cbtn-' + c);
      if (b) { if (c === id) b.classList.add('on'); else b.classList.remove('on'); }
    });
  }

  const caja = document.getElementById('colors');
  caja.innerHTML = coloresDisponibles.map(c =>
    '<button type="button" id="cbtn-' + c + '" data-c="' + c + '">' +
    '<span class="dot" style="background:' + (COLORES[c] ? COLORES[c].hex : '#888') + '"></span>' +
    (COLORES[c] ? COLORES[c].label : c.toUpperCase()) + '</button>'
  ).join('');
  caja.querySelectorAll('button').forEach(b => {
    b.onclick = () => pintarColor(b.dataset.c);
  });

  const filmsBox = document.getElementById('films');
  const clips = [];
  if (CONFIG.filmSlots && CONFIG.filmSlots.length) {
    CONFIG.filmSlots.forEach(function (r) { if (A.video.indexOf(r) !== -1) clips.push(r); });
  }
  if (!clips.length && A.video.length) {
    const familias = ['pomelli-photoshoot-video', 'woman-showing-jacket', 'image-to-video', 'woman-animating',
                      'woman-checks-collar', 'woman-checking-collar', 'modelo-muestra', 'tiktok', 'veo-', 'wan2', 'grok'];
    const usados = new Set();
    const famUsada = new Set();
    for (let i = 0; i < 3; i++) {
      let elegido = null;
      for (let j = 0; j < familias.length && !elegido; j++) {
        if (famUsada.has(familias[j])) continue;
        const hit = A.video.find(x => !usados.has(x) && x.indexOf(familias[j]) !== -1) || null;
        if (hit) { elegido = hit; famUsada.add(familias[j]); }
      }
      if (!elegido) elegido = A.video.find(x => !usados.has(x)) || null;
      if (!elegido) break;
      usados.add(elegido); clips.push(elegido);
    }
  }

  if (clips.length) {
    filmsBox.innerHTML = clips.map((v, i) =>
      '<figure><img alt="Film ' + (i + 1) + '"><video muted loop playsinline preload="metadata" src="' + esc(url(v)) + '"></video></figure>'
    ).join('');
    filmsBox.querySelectorAll('figure').forEach(fig => {
      filmFigs.push(fig);
      const video = fig.querySelector('video');
      let activo = false;
      fig.addEventListener('click', () => {
        if (video.paused) video.play().then(() => { fig.classList.add('playing'); activo = true; }).catch(() => {});
        else { video.pause(); fig.classList.remove('playing'); activo = false; }
      });
      new IntersectionObserver(es => es.forEach(e => {
        if (e.isIntersecting) { video.play().then(() => { fig.classList.add('playing'); activo = true; }).catch(() => {}); }
        else if (activo) { video.pause(); fig.classList.remove('playing'); activo = false; }
      }), { threshold: .55 }).observe(fig);
    });
  } else {
    filmsBox.outerHTML = '<p style="color:var(--muted);font-size:13px;line-height:1.9">AQUI VAN LOS VIDEOS VERTICALES.<br>Ejecuta <b>2-COPIAR-AL-PROYECTO.bat</b> y recarga.</p>';
  }

  let colorActual = coloresDisponibles[0] || 'black';
  function shop() {
    const link = colorActual === 'black' ? CONFIG.payhipBlack : CONFIG.payhipTan;
    if (link.indexOf('REEMPLAZAR') !== -1) { alert('Falta el link de checkout de Payhip.\n\nEdita CONFIG.payhipBlack / CONFIG.payhipTan en este archivo.'); return; }
    window.location.href = link;
  }
  document.getElementById('buyBtn').onclick = shop;
  document.getElementById('buyBtn2').onclick = shop;

  const cajaColores = document.getElementById('colors');
  cajaColores.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) colorActual = b.dataset.c;
  });

  document.getElementById('ytBtn').href = CONFIG.youtube;

  const scarcity = document.getElementById('scarcity');
  if (CONFIG.dropEnd) {
    const fin = Date.parse(CONFIG.dropEnd);
    if (isNaN(fin)) { scarcity.style.display = 'none'; }
    else {
      const cd = document.getElementById('cd');
      const tick = () => {
        const d = fin - Date.now();
        if (d <= 0) { scarcity.textContent = 'DROP PRICE WINDOW CLOSED'; return; }
        const dd = Math.floor(d / 864e5), hh = Math.floor(d % 864e5 / 36e5),
              mm = Math.floor(d % 36e5 / 6e4), ss = Math.floor(d % 6e4 / 1e3);
        cd.textContent = dd + 'D ' + String(hh).padStart(2, '0') + 'H ' + String(mm).padStart(2, '0') + 'M ' + String(ss).padStart(2, '0') + 'S';
      };
      tick(); setInterval(tick, 1000);
    }
  } else {
    scarcity.style.display = 'none';
  }

  if (CONFIG.units) {
    document.getElementById('units').textContent = CONFIG.units;
    document.getElementById('limited').style.display = 'block';
    if (CONFIG.claimed > 0) {
      const quedan = Math.max(0, CONFIG.units - CONFIG.claimed);
      document.getElementById('stockleft').textContent = quedan;
      document.getElementById('stocktotal').textContent = CONFIG.units;
      document.getElementById('stockfill').style.width = Math.round((quedan / CONFIG.units) * 100) + '%';
      document.getElementById('stockwrap').style.display = 'block';
    }
  }

  const form = document.getElementById('list-form');
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'JOINING…';
    try {
      const res = await fetch(CONFIG.formspree, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
      if (res.ok) { form.style.display = 'none'; document.getElementById('list-ok').style.display = 'block'; }
      else { btn.disabled = false; btn.textContent = 'Join'; }
    } catch (err) { btn.disabled = false; btn.textContent = 'Join'; }
  };

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('on'); }), { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));

  if (coloresDisponibles.length) pintarColor(coloresDisponibles[0]);
  else pintarFilms('black');

  if (!hayMedios) console.warn('[BFYT] Sin manifiesto. Ejecuta 2-COPIAR-AL-PROYECTO.bat y sube img/ a GitHub.');
})();
</script>
