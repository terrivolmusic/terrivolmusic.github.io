<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0514">
<title>TERRIVOL MUSIC | Sala de Audición Privada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0514; --bg2:#1a0b2e;
  --cyan:#06B6D4; --magenta:#7C3AED; --pink:#d946ef;
  --text:#e9e6f7; --muted:#8b86a3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;min-height:100vh}
#stars{position:fixed;inset:0;z-index:0}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(124,58,237,.18),transparent),
             radial-gradient(ellipse 50% 35% at 85% 70%,rgba(6,182,212,.12),transparent),
             radial-gradient(ellipse 40% 30% at 60% 30%,rgba(217,70,239,.08),transparent);}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:48px 20px 80px}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px}
.logo{font-family:'Unbounded';font-weight:900;font-size:15px;letter-spacing:2px}
.logo span{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badge{font-size:10px;letter-spacing:3px;border:1px solid rgba(6,182,212,.4);color:var(--cyan);padding:6px 14px;border-radius:100px;text-transform:uppercase}

/* HERO */
.hero{text-align:center;margin-bottom:56px}
.hero h1{font-family:'Unbounded';font-weight:900;font-size:clamp(28px,7vw,48px);line-height:1.1;margin-bottom:16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:15px;max-width:420px;margin:0 auto 20px}
.headphones{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--pink);border:1px solid rgba(217,70,239,.35);padding:8px 18px;border-radius:100px}

/* BEAT CARDS */
.beat{background:rgba(26,11,46,.55);backdrop-filter:blur(14px);border:1px solid rgba(124,58,237,.25);border-radius:18px;padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:18px;transition:.3s;position:relative;overflow:hidden}
.beat:hover{border-color:rgba(6,182,212,.5);transform:translateY(-2px);box-shadow:0 8px 32px rgba(6,182,212,.12)}
.beat .num{position:absolute;top:12px;right:16px;font-family:'Unbounded';font-size:11px;color:rgba(139,134,163,.4)}
.play{width:56px;height:56px;min-width:56px;border-radius:50%;border:1px solid rgba(6,182,212,.5);background:radial-gradient(circle,rgba(6,182,212,.15),transparent);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s}
.play:hover{box-shadow:0 0 24px rgba(6,182,212,.4)}
.play svg{width:20px;height:20px;fill:var(--cyan)}
.info{flex:1}
.info h3{font-family:'Unbounded';font-size:16px;font-weight:700;margin-bottom:6px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;letter-spacing:1px;color:var(--muted);border:1px solid rgba(139,134,163,.3);padding:3px 10px;border-radius:100px}
.tag.hot{color:var(--pink);border-color:rgba(217,70,239,.4)}
/* EQUALIZER */
.eq{display:flex;gap:3px;align-items:flex-end;height:24px}
.eq span{width:3px;background:linear-gradient(180deg,var(--pink),var(--cyan));height:4px;border-radius:2px}
.beat.playing .eq span{animation:eq .8s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.1s}.eq span:nth-child(3){animation-delay:.2s}
.eq span:nth-child(4){animation-delay:.3s}.eq span:nth-child(5){animation-delay:.15s}
@keyframes eq{0%,100%{height:4px}50%{height:22px}}
/* PROGRESS */
.progress{position:absolute;bottom:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
/* CTA */
.cta{margin-top:64px;text-align:center}
.cta h2{font-family:'Unbounded';font-size:clamp(18px,5vw,26px);margin-bottom:12px}
.cta p{color:var(--muted);font-size:14px;margin-bottom:28px}
.btn{display:inline-block;font-family:'Unbounded';font-size:13px;font-weight:700;letter-spacing:1px;text-decoration:none;color:#fff;padding:16px 36px;border-radius:100px;background:linear-gradient(90deg,var(--magenta),var(--pink));box-shadow:0 0 32px rgba(217,70,239,.35);transition:.3s}
.btn:hover{transform:scale(1.04);box-shadow:0 0 48px rgba(217,70,239,.5)}
footer{margin-top:72px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="wrap">

  <header>
    <div class="logo">TERRIVOL <span>MUSIC</span></div>
    <div class="badge">Sala Privada</div>
  </header>

  <section class="hero">
    <h1>MAQUETAS <em>EXCLUSIVAS</em></h1>
    <p>Producción de élite. Sonido oscuro, pesado y cinematográfico, curado para tu estilo.</p>
    <div class="headphones">🎧 ESCUCHA CON AUDÍFONOS</div>
  </section>

  <div id="beats"></div>

  <section class="cta">
    <h2>¿ALGUNA TE VOLÓ LA CABEZA?</h2>
    <p>Hablemos de licencias, packs o un beat 100% a tu medida.</p>
    <a class="btn" id="ctaMain" href="#" target="_blank">HABLAR CON SEBASTIÁN</a>
  </section>

  <footer>© 2026 TERRIVOL MUSIC ENT</footer>
</div>

<script>
// ⚙️ CONFIGURACIÓN — EDITA AQUÍ
const WHATSAPP = "573000000000"; // 👈 TU NÚMERO CON CÓDIGO DE PAÍS
const BEATS = [
  { title:"PARIS NIGHTS",  bpm:142, key:"F#m", style:"Drill / Strav", src:"audio/paris-nights.mp3" },
  { title:"DARK ALLEY",    bpm:140, key:"Am",  style:"Drill Oscuro",  src:"audio/dark-alley.mp3" },
  { title:"VOODOO",        bpm:144, key:"Cm",  style:"Strav Vibe",    src:"audio/voodoo.mp3" },
  { title:"GHOST",         bpm:138, key:"Gm",  style:"Trap / Drill",  src:"audio/ghost.mp3" },
  { title:"SEINE RIVER",   bpm:141, key:"Dm",  style:"Drill Francés", src:"audio/seine-river.mp3" },
  { title:"MIDNIGHT CODE", bpm:145, key:"Em",  style:"Drill / UK",    src:"audio/midnight-code.mp3" },
];

// Render beats
const cont = document.getElementById("beats");
BEATS.forEach((b,i)=>{
  const msg = encodeURIComponent(`Hola Sebastián 🎧 Acabo de escuchar la sala privada y me interesa el beat "${b.title}". Hablemos.`);
  cont.innerHTML += `
  <div class="beat" data-i="${i}">
    <span class="num">0${i+1}</span>
    <button class="play" onclick="toggle(${i})">
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="info">
      <h3>${b.title}</h3>
      <div class="tags">
        <span class="tag hot">${b.style}</span>
        <span class="tag">${b.bpm} BPM</span>
        <span class="tag">${b.key}</span>
      </div>
    </div>
    <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="progress"></div>
  </div>`;
});

// Player (un solo audio a la vez)
let audio = null, current = null;
function toggle(i){
  const card = document.querySelector(`.beat[data-i="${i}"]`);
  if(current === i && audio && !audio.paused){ audio.pause(); return; }
  if(audio){ audio.pause(); document.querySelectorAll(".beat").forEach(c=>reset(c)); }
  audio = new Audio(BEATS[i].src);
  current = i;
  card.classList.add("playing");
  card.querySelector(".ic-play").style.display="none";
  card.querySelector(".ic-pause").style.display="block";
  audio.play();
  audio.ontimeupdate = ()=>{ card.querySelector(".progress").style.width = (audio.currentTime/audio.duration*100)+"%"; };
  audio.onended = ()=> reset(card);
}
function reset(c){
  c.classList.remove("playing");
  c.querySelector(".ic-play").style.display="block";
  c.querySelector(".ic-pause").style.display="none";
  c.querySelector(".progress").style.width="0%";
}

// CTA WhatsApp
document.getElementById("ctaMain").href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola Sebastián 🎧 Ya escuché la sala privada. Hablemos.")}`;

// Starfield
const cv=document.getElementById("stars"),cx=cv.getContext("2d");
let S=[];function rs(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:120},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.3,a:Math.random(),s:Math.random()*.02+.005}));}
rs();addEventListener("resize",rs);
(function draw(){cx.clearRect(0,0,cv.width,cv.height);S.forEach(st=>{st.a+=st.s;cx.globalAlpha=Math.abs(Math.sin(st.a));cx.fillStyle="#cfc8ff";cx.beginPath();cx.arc(st.x,st.y,st.r,0,7);cx.fill();});requestAnimationFrame(draw);})();
</script>
</body>
</html>
