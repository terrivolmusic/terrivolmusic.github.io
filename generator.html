<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFYT SEO Engine - FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card: #16161e; --border: #2a2a35; --primary: #8a2be2; --accent: #00f2ff; --text: #e0e0e0; --muted: #a1a1aa; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; background: linear-gradient(90deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 2rem; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
        .card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }
        input, select, textarea { width: 100%; background: #0f0f15; border: 1px solid var(--border); color: white; padding: 0.7rem; border-radius: 8px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
        textarea { min-height: 80px; resize: vertical; }

        .btn { width: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; border: none; padding: 0.8rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }
        .btn:hover { opacity: 0.9; }

        .output-section { margin-bottom: 1.5rem; position: relative; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .output-header h3 { font-size: 0.95rem; color: var(--primary); font-weight: 600; }
        .copy-btn { background: var(--border); color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .copy-btn:hover { background: var(--accent); color: #000; }
        .regen-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
        .regen-btn:hover { border-color: var(--accent); color: var(--accent); }

        .box { background: #0f0f15; border: 1px solid var(--border); padding: 1rem; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.85rem; line-height: 1.5; color: #ccc; white-space: pre-wrap; }
        
        .options-grid { display: grid; gap: 0.5rem; }
        .option-card { background: #0f0f15; border: 1px solid var(--border); padding: 0.8rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-card:hover { border-color: var(--primary); }
        .option-card.active { border-color: var(--accent); background: rgba(0, 242, 255, 0.05); }
        .option-title { font-weight: 600; color: var(--text); font-size: 0.9rem; margin-bottom: 0.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>BFYT SEO ENGINE - FINAL</h1>
        </header>

        <div class="grid">
            <div class="card">
                <h2>️ Datos del Beat</h2>
                <div class="form-group">
                    <label>BPM</label>
                    <input type="number" id="bpm" placeholder="Ej: 139">
                </div>
                <div class="form-group">
                    <label>Mood / Energía</label>
                    <select id="mood">
                        <option value="melodic">Dark Melodic (Triste, Piano)</option>
                        <option value="cinematic">Cinematic (Épico, Orquestal)</option>
                        <option value="rage">Rage (Agresivo, Distorsión)</option>
                        <option value="drill">UK Drill (Oscuro, Sliding 808s)</option>
                        <option value="opium">Opium (Psicodélico, Underground)</option>
                        <option value="space">Space (Futurista, Galáctico)</option>
                        <option value="angelic">Angelic (Etéreo, Paz, Voz)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Intención / Descripción (Libre)</label>
                    <textarea id="intencion" placeholder="Ej: beat de trap epico, con musica muy emocional y orquestal, moderno"></textarea>
                </div>
                <button class="btn" onclick="generarTodo()">🚀 Generar SEO Completo</button>
            </div>

            <div class="card">
                <h2>📊 Resultados SEO</h2>
                
                <div class="output-section">
                    <div class="output-header">
                        <h3>🎯 Nombres (Anti-Repetición)</h3>
                        <button class="regen-btn" onclick="regenerarNombres()">🎲 Cambiar</button>
                    </div>
                    <div class="options-grid" id="nameOptions"></div>
                </div>

                <div class="output-section">
                    <div class="output-header"><h3> Títulos</h3></div>
                    <div class="options-grid" id="titleOptions"></div>
                </div>

                <div class="output-section">
                    <div class="output-header"><h3>📝 Meta & Descripción</h3><button class="copy-btn" onclick="copiar('out-desc')">Copiar</button></div>
                    <div class="box" id="out-desc"></div>
                </div>

                <div class="output-section">
                    <div class="output-header"><h3>🏷️ Tags (500 chars)</h3><button class="copy-btn" onclick="copiar('out-tags')">Copiar</button></div>
                    <div class="box" id="out-tags"></div>
                </div>

                <div class="output-section">
                    <div class="output-header"><h3>🎨 Prompt Miniatura (Variado pero IDENTIDAD BFYT)</h3><button class="copy-btn" onclick="copiar('out-prompt')">Copiar</button></div>
                    <div class="box" id="out-prompt"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const raicesA = ["Aether", "Velvet", "Neon", "Shadow", "Crystal", "Ivory", "Midnight", "Phantom", "Cosmic", "Stellar", "Quantum", "Nebula", "Obsidian", "Platinum", "Noir", "Eclipse", "Titan", "Apex", "Prism", "Void", "Eternal", "Silent", "Fading", "Broken", "Lost", "Echo", "Silk", "Frequency", "Dollar", "After", "Luminous", "Black", "Voltage", "Destroy", "Chaos", "Riot", "Maximum", "Dark", "System", "Breach", "Cyber", "Digital", "Berserk", "Engine", "Overload", "Apocalypse", "Burgundy", "Code", "Zero", "Ghost", "Steel", "Urban", "Concrete", "Block", "Psychedelic", "Cartel", "Opium", "Vampire", "Playboi", "Underground", "Psycho", "Blood", "Dreams", "Nights", "Protocol", "Mode", "State", "Galactic", "Interstellar", "Starlight", "Orbital", "Space", "Universal", "Angelic", "Celestial", "Heaven", "Divine", "Ethereal", "Sacred", "Harmony"];
        const raicesB = ["Drift", "Protocol", "Mechanism", "Syndicate", "Cartel", "Ascension", "Horizon", "Cathedral", "Symphony", "Circuit", "Dawn", "Veil", "Rise", "Velocity", "Orbit", "Cascade", "Infinity", "Zenith", "Sky", "Night", "Nocturne", "Oblivion", "Confession", "Memories", "Mind", "Ritual", "Tears", "Heart", "Eyes", "Signal", "Force", "Visa", "Theory", "Predator", "Control", "Overdrive", "Crash", "Warfare", "District", "Ops", "Sector", "Visibility", "Raid", "Curtain", "Jungle", "Lonely", "Active", "X", "Voyage", "Odyssey", "Peace", "Serenity", "Ascent", "Echoes", "Whispers", "Illusions", "Mirage", "Specter", "Wraith", "Requiem", "Anthem", "Legacy", "Dynasty", "Empire", "Kingdom", "Realm", "Domain", "Frontier", "Expanse", "Horizon", "Matrix", "Vector", "Pulse", "Wave", "Flux", "Core", "Node", "Link", "Gate", "Portal"];

        // VARIACIÓN REAL PERO SIEMPRE TRAP LATINO ELEGANTE
        const moods = {
            melodic: { 
                micro: "Dark Melodic", vibe: "Emotional Melodic", energia: "Baja", playlist: "Dark Melodic / Sad Trap", 
                descVibe: "emotional piano progressions and melancholic atmospheric pads",
                artists: ["Juice WRLD", "The Kid LAROI"],
                // VARIACIÓN: Outfit triste/romántico pero trap
                outfit: "oversized black leather jacket over fitted dark turtleneck with subtle silver chains",
                hair: "long wavy brunette hair with natural waves falling over shoulders",
                makeup: "soft smoky eye makeup with glossy nude lips and subtle contour",
                lighting: "cool blue and soft purple neon lighting from car interior LEDs, rainy night reflections on windows",
                pose: "sitting in back seat of luxury car, leaning head against window, melancholic gaze looking out at city lights"
            },
            cinematic: { 
                micro: "Cinematic Trap", vibe: "Dark Cinematic", energia: "Media", playlist: "Cinematic Trap Beats", 
                descVibe: "cinematic orchestral textures and epic dark production",
                artists: ["Travis Scott", "Don Toliver"],
                // VARIACIÓN: Outfit épico/lujo pero trap
                outfit: "sleek black satin blazer with sharp shoulders over fitted black top, tailored to perfection",
                hair: "sleek straight black hair styled in sophisticated middle part, glossy finish",
                makeup: "bold glamorous makeup with sharp winged eyeliner, defined brows and deep red glossy lips",
                lighting: "warm golden and deep purple ambient lighting from luxury car interior, city skyline glowing through windows",
                pose: "sitting in driver seat of luxury sports car, one hand on steering wheel, confident direct gaze at camera"
            },
            rage: { 
                micro: "Rage", vibe: "High Energy Hardcore", energia: "Alta", playlist: "Rage / Underground Beats", 
                descVibe: "aggressive distorted synths and high-energy 808s",
                artists: ["Playboi Carti", "Ken Carson"],
                // VARIACIÓN: Outfit agresivo/underground pero trap
                outfit: "distressed black leather motorcycle jacket with metal studs over mesh top, edgy and bold",
                hair: "voluminous curly dark hair with subtle purple highlights, wild and untamed",
                makeup: "bold dramatic makeup with heavy smoky eyes, dark lips and sharp contour for fierce look",
                lighting: "intense red and electric blue neon lighting from car dashboard and street lights, high contrast shadows",
                pose: "leaning out of luxury car window, one arm resting on roof, intense aggressive gaze at camera"
            },
            drill: { 
                micro: "UK Drill", vibe: "Dark Piano Drill", energia: "Alta", playlist: "UK Drill / Brooklyn Drill", 
                descVibe: "sliding 808s, rapid hi-hats and dark drill percussion",
                artists: ["Pop Smoke", "Central Cee"],
                // VARIACIÓN: Outfit street/urbano pero trap elegante
                outfit: "premium black puffer jacket with subtle designer logo over dark fitted hoodie, street luxury",
                hair: "sleek high ponytail with baby hairs styled perfectly, polished and sharp",
                makeup: "natural glam makeup with defined brows, subtle contour and glossy lips, fresh but fierce",
                lighting: "cold blue street lighting mixed with warm orange from street lamps, urban night atmosphere",
                pose: "standing next to luxury car with one hand on hip, other hand holding chain, serious confident expression"
            },
            opium: { 
                micro: "Opium", vibe: "Dark Psychedelic", energia: "Media", playlist: "Opium / Carti Style Beats", 
                descVibe: "dark psychedelic textures and eerie neon-lit production",
                artists: ["Playboi Carti", "Destroy Lonely"],
                // VARIACIÓN: Outfit psicodélico/avant-garde pero trap
                outfit: "all-black asymmetric designer outfit with strategic cutouts and layered silver chains, avant-garde trap",
                hair: "straight platinum blonde hair with dark roots, bold and striking contrast",
                makeup: "experimental makeup with graphic black eyeliner, dark lips and pale skin for mysterious vibe",
                lighting: "saturated purple and magenta neon lighting with occasional green flashes, psychedelic car interior",
                pose: "sitting on hood of luxury car, legs crossed, one hand holding chain up to camera, mysterious half-smile"
            },
            space: { 
                micro: "Space Trap", vibe: "Futuristic Space", energia: "Media", playlist: "Cinematic Trap Beats", 
                descVibe: "futuristic space synths and cosmic atmospheric production",
                artists: ["Travis Scott", "Kid Cudi"],
                // VARIACIÓN: Outfit futurista pero trap (NO espacial)
                outfit: "metallic gunmetal grey fitted jacket with subtle reflective details over black turtleneck, futuristic trap",
                hair: "long straight hair with subtle holographic highlights that catch the light, sleek and modern",
                makeup: "futuristic glam makeup with holographic eyeshadow accents, glossy lips and sharp contour",
                lighting: "cool cyan and deep purple cosmic lighting from car interior LEDs, star-like reflections on surfaces",
                pose: "sitting in luxury car with panoramic roof showing night sky, looking up with awe, one hand on chain"
            },
            angelic: { 
                micro: "Angelic Trap", vibe: "Angelic Cinematic", energia: "Baja", playlist: "Cinematic Trap Beats", 
                descVibe: "ethereal vocal samples, celestial melodies and angelic atmosphere",
                artists: ["Travis Scott", "Don Toliver"],
                // VARIACIÓN: Outfit etéreo pero trap elegante
                outfit: "flowing champagne silk blouse with delicate details over fitted black pants, elegant and ethereal",
                hair: "long flowing honey blonde hair with soft waves, angelic and luminous",
                makeup: "ethereal glow makeup with soft highlighter, natural tones and glossy lips, angelic radiance",
                lighting: "soft golden and warm white ambient lighting from car interior, divine glow effect",
                pose: "sitting gracefully in luxury car, both hands gently holding chain, serene peaceful expression with soft smile"
            }
        };

        let currentNames = [];
        let selectedName = '';
        let selectedTitle = '';

        function generarNombresUnicos(cantidad) {
            let nombres = [];
            let intentos = 0;
            while(nombres.length < cantidad && intentos < 100) {
                const a = raicesA[Math.floor(Math.random() * raicesA.length)];
                const b = raicesB[Math.floor(Math.random() * raicesB.length)];
                const nombre = `${a} ${b}`;
                if(!nombres.includes(nombre) && !currentNames.includes(nombre)) {
                    nombres.push(nombre);
                }
                intentos++;
            }
            return nombres;
        }

        function regenerarNombres() {
            currentNames = generarNombresUnicos(3);
            selectedName = currentNames[0];
            renderizarNombres();
            actualizarTitulos();
            actualizarPrompt();
        }

        function renderizarNombres() {
            document.getElementById('nameOptions').innerHTML = currentNames.map((nombre, i) => `
                <div class="option-card ${i === 0 ? 'active' : ''}" onclick="seleccionarNombre('${nombre}', this)">
                    <div class="option-title">${nombre}</div>
                </div>
            `).join('');
        }

        function seleccionarNombre(nombre, element) {
            selectedName = nombre;
            document.querySelectorAll('#nameOptions .option-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            actualizarTitulos();
            actualizarPrompt();
        }

        function actualizarTitulos() {
            const bpm = document.getElementById('bpm').value || "120";
            const moodKey = document.getElementById('mood').value;
            const mood = moods[moodKey];
            const art = mood.artists;

            const t1 = `${mood.micro} Type Beat - "${selectedName}" | ${mood.vibe} ${bpm} BPM`;
            const t2 = `${art[0]} x ${art[1]} Type Beat - "${selectedName}" | ${mood.vibe} ${bpm} BPM`;
            const t3 = `${art[0]} Type Beat - "${selectedName}" | ${mood.vibe} ${bpm} BPM`;

            document.getElementById('titleOptions').innerHTML = `
                <div class="option-card active" onclick="seleccionarTitulo(this, '${t1.replace(/'/g, "\\'")}')">
                    <div class="option-title">${t1}</div>
                </div>
                <div class="option-card" onclick="seleccionarTitulo(this, '${t2.replace(/'/g, "\\'")}')">
                    <div class="option-title">${t2}</div>
                </div>
                <div class="option-card" onclick="seleccionarTitulo(this, '${t3.replace(/'/g, "\\'")}')">
                    <div class="option-title">${t3}</div>
                </div>
            `;
            selectedTitle = t1;
        }

        function seleccionarTitulo(element, titulo) {
            selectedTitle = titulo;
            document.querySelectorAll('#titleOptions .option-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }

        function actualizarPrompt() {
            const moodKey = document.getElementById('mood').value;
            const mood = moods[moodKey];
            
            // PROMPT CON VARIACIÓN REAL PERO SIEMPRE IDENTIDAD BFYT
            const prompt = `Raw photo, shot on 35mm film camera, breathtakingly beautiful curvy Latina woman with voluptuous hourglass figure, fit and thick, transmitting pure trap flow, boss energy, and street luxury elegance. ${mood.hair}. Striking facial features, fierce confident gaze, ${mood.makeup}. She is sitting in luxury car at night wearing ${mood.outfit}. ${mood.pose}. Heavy diamond Cuban link chain with "${selectedName.toUpperCase()}" text pendant clearly visible between her fingers as her hand rests on the chain, long acrylic nails with chrome finish, iced-out diamond rings on her fingers, iced-out rose gold watch. Lighting: ${mood.lighting}. Moody nocturnal atmosphere, dark luxury car interior with ambient LED strips. Cinematic lighting highlighting her hand on the chain, her curves, facial contours, and jewelry sparkle. Professional trap music video aesthetic, sensual luxurious vibe, high contrast, shallow depth of field, NO TEXT OVERLAY, NO LETTERS except chain pendant --ar 1:1 --style raw_photo --quality 2`;
            
            document.getElementById('out-prompt').textContent = prompt;
        }

        function generarTodo() {
            const bpm = document.getElementById('bpm').value || "120";
            const intencion = document.getElementById('intencion').value;
            const moodKey = document.getElementById('mood').value;
            const mood = moods[moodKey];

            currentNames = generarNombresUnicos(3);
            selectedName = currentNames[0];
            renderizarNombres();
            actualizarTitulos();
            actualizarPrompt();

            const desc = `Canal: Beats BFYT
Playlist: ${mood.playlist}
Micro-nicho: ${mood.micro}
Energía: ${mood.energia}
Vibe: ${mood.vibe}

${selectedName} is a ${mood.micro.toLowerCase()} beat with ${mood.descVibe}${intencion ? '. ' + intencion : ''}. 

🛒 Purchase a license & download instantly: https://beats-bfyt-shop.fourthwall.com

💿 License Tiers:
• Basic: $14.99 (MP3, Non-profit use)
• Standard: $29.99 (MP3 + WAV, Commercial use)
• Premium: $49.99 (MP3 + WAV + STEMS, Full commercial use)

⚠️ FREE for non-profit use only (must credit "Prod. by Beats BFYT" in the title). Purchase a license for commercial use, Spotify, Apple Music, or monetization.

📱 Follow the journey:
Instagram: @beatsfreeyoutube_
TikTok: @beatsfreeyoutube_

#typebeat #${mood.micro.replace(' ', '')} #BeatsBFYT #${selectedName.replace(' ', '')}`;
            
            document.getElementById('out-desc').textContent = desc;

            const tagsBase = `${mood.micro.toLowerCase()} type beat, ${selectedName.toLowerCase().replace(' ', '')} beat, ${bpm} bpm ${mood.micro.toLowerCase()}, Beats BFYT, premium trap production, ${mood.micro.toLowerCase()} instrumental, dark ${mood.micro.toLowerCase()} beat, atmospheric trap beat, ${mood.micro.toLowerCase()} type beat 2026, ${mood.vibe.toLowerCase()} trap instrumental, ${mood.micro.toLowerCase()} beat download, ${mood.artists[0].toLowerCase()} type beat, ${mood.artists[1].toLowerCase()} type beat, futuristic trap, luxury trap, cinematic trap, dark trap instrumental, melodic trap, emotional trap`;
            
            const tagsCortadas = tagsBase.substring(0, 500);
            document.getElementById('out-tags').textContent = tagsCortadas.substring(0, tagsCortadas.lastIndexOf(','));
        }

        function copiar(id) {
            const texto = document.getElementById(id).textContent;
            navigator.clipboard.writeText(texto).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✅ ¡Copiado!';
                setTimeout(() => { btn.textContent = original; }, 1500);
            });
        }
    </script>
</body>
</html>
